---
- name: Install Docker prerequisites
  apt:
    name: [ca-certificates, curl, gnupg, lsb-release]
    state: present
    update_cache: yes

- name: Add Docker GPG key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker repository
  shell: |
    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list

- name: Install Docker
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: yes

- name: Start Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Install docker-compose standalone
  shell: |
    curl -SL "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
    chmod +x /usr/local/bin/docker-compose
  args:
    creates: /usr/local/bin/docker-compose

- name: Create app directory
  file:
    path: /home/vagrant/app
    state: directory
    owner: vagrant

- name: Copy docker-compose.yml
  copy:
    src: /home/vagrant/docker-compose.yml
    dest: /home/vagrant/app/docker-compose.yml
    owner: vagrant

- name: Copy services source code
  copy:
    src: /home/vagrant/services/
    dest: /home/vagrant/app/services/
    owner: vagrant

- name: Deploy with docker-compose
  shell: cd /home/vagrant/app && docker-compose up -d
  environment:
    DOCKER_BUILDKIT: "0"
