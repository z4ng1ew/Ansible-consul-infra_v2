---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Apache
  apt:
    name: apache2
    state: present

- name: Start and enable Apache
  systemd:
    name: apache2
    state: started
    enabled: yes

- name: Create custom index page
  copy:
    content: |
      <html>
      <head><title>Node02 - Apache</title></head>
      <body>
      <h1>Hello from node02!</h1>
      <p>Apache is running on node02 (192.168.56.12)</p>
      </body>
      </html>
    dest: /var/www/html/index.html
    owner: www-data
    mode: '0644'
